# ------------------------------------------------------------
# ДЖЕРЕЛА НОВИН
# ------------------------------------------------------------
# Сайти, звідки бот бере новини. Можна додати свій RSS,
# але переконайтеся, що сайт справді публікує добрі новини.
sources:
  - name: "Good News Network"
    url: "https://www.goodnewsnetwork.org/feed/"
  - name: "Positive News"
    url: "https://www.positive.news/feed/"
  - name: "Reasons to be Cheerful"
    url: "https://reasonstobecheerful.world/feed/"
  - name: "Optimist Daily"
    url: "https://www.optimistdaily.com/feed/"
  - name: "Smithsonian"
    url: "https://www.smithsonianmag.com/rss/latest_articles/"
  - name: "Phys.org"
    url: "https://phys.org/rss-feed/breaking/science-news/"
  - name: "ScienceDaily"
    url: "https://www.sciencedaily.com/rss/top/science.xml"


# ------------------------------------------------------------
# ПЕРЕКЛАД
# ------------------------------------------------------------
# provider: claude — гарний людський переказ + перевірка, чи новина
#                    справді добра. Потрібен платний ключ Anthropic.
# provider: google — безкоштовно, але переклад машинний і місцями
#                    кострубатий, і без перевірки настрою новини.
#
# Якщо стоїть claude, але ключа немає — бот САМ перейде на google
# і напише про це в лог. Тобто він працюватиме в будь-якому разі.
translation:
  provider: claude
  model: "claude-haiku-4-5-20251001"
  style: "тепло, просто і по-людськи, як розповідають добру новину рідним"
  max_chars: 600


# ------------------------------------------------------------
# ПІДПИС ПІД ПОСТОМ
# ------------------------------------------------------------
# Що писати маленьким рядком у кінці кожного поста.
# Залиште порожні лапки "" — і підпису не буде.
footer: "🌻 Добрі новини"
