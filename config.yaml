# ============================================================
#  НАЛАШТУВАННЯ БОТА ДОБРИХ НОВИН
# ============================================================
#
#  Це єдиний файл, який вам потрібно міняти.
#  Його можна редагувати прямо на сайті GitHub з телефона:
#  відкрити файл -> натиснути олівець -> змінити -> "Commit changes".
#
#  ВАЖЛИВО: відступи на початку рядків (пробіли) міняти НЕ можна,
#  інакше бот не зрозуміє файл. Міняйте лише самі значення.
#
# ============================================================


# ------------------------------------------------------------
# СКІЛЬКИ НОВИН НА ДЕНЬ
# ------------------------------------------------------------
# Загальна кількість новин за добу. Вони розділяться між
# часами розсилки (див. send_times) якомога рівніше.
# Приклад: 5 новин і 3 часи розсилки -> прийде 2, 2 і 1.
posts_per_day: 5


# ------------------------------------------------------------
# О КОТРІЙ ГОДИНІ НАДСИЛАТИ
# ------------------------------------------------------------
# Час київський. Формат "ГОДИНА:ХВИЛИНИ" в лапках.
# Можна додати або прибрати рядки — хоч один час, хоч п'ять.
send_times:
  - "09:00"
  - "14:00"
  - "20:00"

# Часовий пояс. Міняти не треба.
timezone: "Europe/Kyiv"


# ------------------------------------------------------------
# СВІЖІСТЬ НОВИН
# ------------------------------------------------------------
# Не брати новини, старші за стільки днів.
max_age_days: 5


# ------------------------------------------------------------
# ТЕМИ НОВИН
# ------------------------------------------------------------
# enabled: true  — тема увімкнена (новини на цю тему приходитимуть)
# enabled: false — тема вимкнена
#
# Щоб увімкнути тему, просто замініть false на true і збережіть.
#
# keywords — це слова англійською, за якими бот шукає новини.
# Вони англійською тому, що новини беруться з англомовних сайтів,
# а вже потім перекладаються українською.
topics:

  - name: "Наука і медицина"
    enabled: true
    keywords:
      - research
      - study
      - scientists
      - discovery
      - medicine
      - health
      - treatment
      - cure
      - vaccine
      - therapy
      - breakthrough
      - patients
      - doctors
      - hospital
      - brain
      - cancer
      - disease

  - name: "Природа і тварини"
    enabled: true
    keywords:
      - animal
      - animals
      - wildlife
      - species
      - forest
      - ocean
      - dog
      - dogs
      - cat
      - cats
      - birds
      - whale
      - elephant
      - conservation
      - nature
      - park
      - river
      - coral
      - bees
      - rescued

  - name: "Люди й добрі вчинки"
    enabled: true
    keywords:
      - kindness
      - volunteer
      - volunteers
      - community
      - helped
      - helping
      - donated
      - donation
      - charity
      - neighbors
      - hero
      - reunited
      - stranger
      - generosity
      - saved
      - gift
      - family

  - name: "Технології та екологія"
    enabled: true
    keywords:
      - solar
      - renewable
      - energy
      - climate
      - recycling
      - sustainable
      - electric
      - battery
      - clean
      - technology
      - invention
      - engineers
      - robot
      - innovation
      - emissions
      - green

  - name: "Культура і спорт"
    enabled: false
    keywords:
      - music
      - art
      - artist
      - museum
      - film
      - book
      - festival
      - dance
      - theater
      - athlete
      - olympic
      - champion
      - team
      - record
      - marathon

  - name: "Космос"
    enabled: false
    keywords:
      - space
      - nasa
      - telescope
      - galaxy
      - planet
      - mars
      - moon
      - astronaut
      - rocket
      - asteroid
      - orbit
      - cosmic
      - star
      - satellite


# ------------------------------------------------------------
# СТОП-СЛОВА
# ------------------------------------------------------------
# Якщо будь-яке з цих слів є в заголовку або описі новини —
# бот її НЕ надішле. Це захист, щоб у родинний чат не потрапило
# нічого важкого. Можна додавати свої слова (англійською).
