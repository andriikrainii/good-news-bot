name: Добрі новини

on:
  # Три спроби на годину, у різні хвилини.
  #
  # Спостереження: GitHub на безкоштовному тарифі виконує приблизно одну
  # заплановану спробу з чотирьох, з проміжками по 3-4 години. З трьох
  # спроб шанс, що бодай одна вціліє, значно вищий.
  #
  # Пропущені спроби хвилин не витрачають — платиться лише за ті, що
  # справді запустились. Хвилини не рівні (не 0, не 30): на початку
  # і в середині години Actions найбільше перевантажений.
  schedule:
    - cron: "7 * * * *"
    - cron: "23 * * * *"
    - cron: "44 * * * *"
  # Кнопка "Run workflow" для ручного запуску.
  workflow_dispatch:
    inputs:
      mode:
        description: "Що зробити"
        required: true
        default: "schedule"
        # schedule — звичайний запуск за розкладом
        # test     — надіслати одну новину прямо зараз
        # dry-run  — показати новини в логах, нічого не надсилати
        # setup-webhook — підключити миттєві кнопки через Netlify
        type: choice
        options:
          - schedule
          - test
          - dry-run
          - setup-webhook

# Дозвіл комітити пам'ять бота і зміни налаштувань назад у репозиторій.
permissions:
  contents: write

# Щоб два запуски не накладались один на одного.
concurrency:
  group: goodnews
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Забрати код
        uses: actions/checkout@v4

      - name: Поставити Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Поставити бібліотеки
        run: pip install -r requirements.txt

      - name: Підключити миттєві кнопки
        if: inputs.mode == 'setup-webhook'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          NETLIFY_URL: ${{ secrets.NETLIFY_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: python bot.py --setup-webhook

      - name: Відповісти на кнопки й команди з групи
        if: inputs.mode != 'dry-run' && inputs.mode != 'setup-webhook'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NETLIFY_URL: ${{ secrets.NETLIFY_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: python bot.py --listen

      - name: Надіслати новини
        if: inputs.mode != 'setup-webhook'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NETLIFY_URL: ${{ secrets.NETLIFY_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          MODE: ${{ inputs.mode || 'schedule' }}
        run: |
          case "$MODE" in
            test)    python bot.py --test ;;
            dry-run) python bot.py --dry-run --count 3 ;;
            *)       python bot.py ;;
          esac

      - name: Запам'ятати зміни
        run: |
          if [ -n "$(git status --porcelain state.json config.yaml)" ]; then
            git config user.name "good-news-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state.json config.yaml
            git commit -m "Оновлення пам'яті та налаштувань бота"
            git pull --rebase --autostash
            git push
          else
            echo "нічого не змінилось"
          fi
