name: Добрі новини

on:
  # Бот вмикається кожні 5 хвилин: забирає з групи натискання кнопок
  # і команди, відповідає на них, а тоді сам вирішує, чи час слати новини.
  #
  # ЯКЩО ЗАХОЧЕТЕ ЗРОБИТИ РЕПОЗИТОРІЙ ПРИВАТНИМ — поміняйте рядок нижче
  # на "5 * * * *" (раз на годину). Інакше не вистачить безкоштовних
  # хвилин GitHub. Кнопки тоді відповідатимуть повільніше.
  schedule:
    - cron: "*/5 * * * *"
  # Кнопка "Run workflow" для ручного запуску.
  workflow_dispatch:
    inputs:
      mode:
        description: "Що зробити"
        required: true
        default: "schedule"
        # schedule — звичайний запуск за розкладом
        # test     — надіслати одну новину прямо зараз
        # dry-run  — показати новини в логах, нічого не надсилати
        type: choice
        options:
          - schedule
          - test
          - dry-run

# Дозвіл комітити пам'ять бота і зміни налаштувань назад у репозиторій.
permissions:
  contents: write

# Щоб два запуски не накладались один на одного.
concurrency:
  group: goodnews
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Забрати код
        uses: actions/checkout@v4

      - name: Поставити Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Поставити бібліотеки
        run: pip install -r requirements.txt

      - name: Відповісти на кнопки й команди з групи
        if: inputs.mode != 'dry-run'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --listen

      - name: Надіслати новини
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODE: ${{ inputs.mode || 'schedule' }}
        run: |
          case "$MODE" in
            test)    python bot.py --test ;;
            dry-run) python bot.py --dry-run --count 3 ;;
            *)       python bot.py ;;
          esac

      - name: Запам'ятати зміни
        run: |
          if [ -n "$(git status --porcelain state.json config.yaml)" ]; then
            git config user.name "good-news-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state.json config.yaml
            git commit -m "Оновлення пам'яті та налаштувань бота"
            git pull --rebase --autostash
            git push
          else
            echo "нічого не змінилось"
          fi
